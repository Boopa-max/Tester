<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boopa Loading Screen</title>
    <!-- Importing a clean cursive font that matches your style -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #3b6982;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c5267;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        /* The Apple-style writing text effect */
        .loading-text {
            font-family: 'Great Vibes', cursive;
            font-size: 80px;
            font-weight: 400;
            /* Transparent fill with a white stroke makes it look like an outline waiting to be drawn */
            fill: transparent;
            stroke: #ffffff;
            stroke-width: 2px;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: writeText 3.5s ease-in-out forwards;
        }

        @keyframes writeText {
            0% {
                stroke-dashoffset: 500;
                fill: transparent;
            }
            70% {
                stroke-dashoffset: 0;
                fill: transparent;
            }
            100% {
                stroke-dashoffset: 0;
                fill: #ffffff; /* Fills solid white at the end */
            }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        #main-content {
            padding: 40px;
            color: white;
            text-align: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <svg width="400" height="150" viewBox="0 0 400 150">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="loading-text">Boopa</text>
        </svg>
    </div>

    <div id="main-content">
        <h1>Welcome to Boopa</h1>
        <p>Much better than a black potato!</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('fade-out');
            }, 3500);
        });
    </script>
</body>
</html>
