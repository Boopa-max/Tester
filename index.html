<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boopa Loading Screen</title>
    <style>
        /* Reset and layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #3b6982; /* Matches your image background tone */
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Loading Screen Container */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c5267; /* Darker tone for loader overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        /* Apple-style drawing animation */
        .boopa-svg {
            width: 300px;
            height: auto;
        }

        .boopa-path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Dash setup: length of path needs to match or exceed total path length */
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: drawLogo 3.5s ease-in-out forwards;
        }

        /* Keyframes for drawing effect and final fade-in fill */
        @keyframes drawLogo {
            0% {
                stroke-dashoffset: 600;
                fill: transparent;
            }
            70% {
                stroke-dashoffset: 0;
                fill: transparent;
            }
            100% {
                stroke-dashoffset: 0;
                fill: #ffffff; /* Fills in solid white at the end just like Apple's logo */
            }
        }

        /* Class added via JS to hide loader */
        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Main website content styling */
        #main-content {
            padding: 40px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
  <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="logo-container">
            <!-- Cursive B with drawing/stroke animation -->
            <svg class="letter-svg" viewBox="0 0 100 120">
                <path class="draw-path" d="M30,100 C20,100 15,90 15,75 C15,50 40,40 55,55 C65,65 65,85 50,95 C35,105 20,95 25,80 C30,65 50,45 70,45 C85,45 95,55 95,75 C95,95 85,105 70,105" />
            </svg>
            <!-- Clean 'oopa' text that fades and slides in smoothly -->
            <span class="fade-text">OOPA</span>
        </div>
    </div>

    <!-- Main Website Content -->
    <div id="main-content">
        <h1>Welcome to Boopa</h1>
        <p>Your website content loads smoothly right after the animation finishes!</p>
    </div>

    <script>
        // Hide loading screen once the window has fully loaded
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loading-screen');
                loader.classList.add('fade-out');
            }, 3000); // Keeps the animation playing for 3 seconds before fading
        });
    </script>
</body>
</html>
